<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0088FF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadowCyan" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00F0FF" flood-opacity="0.15"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .terminal-text {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
        font-size: 13.5px;
        line-height: 22px;
      }
      .c-dim { fill: #6E7681; }
      .c-white { fill: #F0F6FC; }
      .c-cyan { fill: #00F0FF; font-weight: 700; }
      .c-blue { fill: #388BFD; }
      .c-green { fill: #00FF66; font-weight: 600; }
      .c-red { fill: #FF3366; font-weight: 700; }
      .c-yellow { fill: #FFBD2E; font-weight: 600; }
      .c-purple { fill: #D2A8FF; }

      @keyframes cycleAnim {
        0% { opacity: 0; transform: translateY(4px); }
        3% { opacity: 1; transform: translateY(0); }
        92% { opacity: 1; transform: translateY(0); }
        98% { opacity: 0; transform: translateY(-2px); }
        100% { opacity: 0; }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .cursor {
        animation: blink 1s infinite;
        fill: #00F0FF;
      }

      .anim-l0 { animation: cycleAnim 13s ease infinite; animation-delay: 0.1s; }
      .anim-l1 { animation: cycleAnim 13s ease infinite; animation-delay: 1.0s; }
      .anim-l2 { animation: cycleAnim 13s ease infinite; animation-delay: 2.1s; }
      .anim-l3 { animation: cycleAnim 13s ease infinite; animation-delay: 3.2s; }
      .anim-l4 { animation: cycleAnim 13s ease infinite; animation-delay: 4.4s; }
      .anim-l5 { animation: cycleAnim 13s ease infinite; animation-delay: 5.5s; }
      .anim-l6 { animation: cycleAnim 13s ease infinite; animation-delay: 6.7s; }
      .anim-l7 { animation: cycleAnim 13s ease infinite; animation-delay: 7.8s; }
      .anim-l8 { animation: cycleAnim 13s ease infinite; animation-delay: 8.9s; }
      .anim-l9 { animation: cycleAnim 13s ease infinite; animation-delay: 10.0s; }
    </style>
  </defs>

  <!-- Terminal Window Outer Frame -->
  <rect x="10" y="10" width="860" height="450" rx="12" ry="12" fill="#0A0E17" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.4" filter="url(#shadowCyan)"/>

  <!-- Titlebar -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 858 10 C 864.63 10 870 15.37 870 22 L 870 46 L 10 46 Z" fill="#111827"/>
  <line x1="10" y1="46" x2="870" y2="46" stroke="#1F2937" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="32" cy="28" r="6" fill="#FF5F56"/>
  <circle cx="52" cy="28" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="28" r="6" fill="#27C93F"/>

  <!-- Title text -->
  <text x="440" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8B949E" font-weight="500">
    agent-run-ledger — durable execution &amp; anti-loop circuit breaker — 860x450
  </text>

  <!-- Terminal Content -->
  <g class="terminal-text" transform="translate(30, 80)">
    
    <!-- Line 0: Command Invocation -->
    <g class="anim-l0">
      <text x="0" y="0">
        <tspan class="c-cyan">❯ </tspan>
        <tspan class="c-blue">run-ledger</tspan>
        <tspan class="c-white"> execute </tspan>
        <tspan class="c-dim">--intent "Deploy microservice v1.4 to production k8s"</tspan>
      </text>
    </g>

    <!-- Line 1: Run Created -->
    <g class="anim-l1" transform="translate(0, 28)">
      <text x="0" y="0">
        <tspan class="c-dim">[LEDGER]</tspan>
        <tspan class="c-cyan"> Initialized Run: </tspan>
        <tspan class="c-white">run_90c_8f2a1b</tspan>
        <tspan class="c-dim"> [Status: </tspan><tspan class="c-yellow">RUNNING</tspan><tspan class="c-dim"> | Protocol: Skill 90c / 83]</tspan>
      </text>
    </g>

    <!-- Line 2: Step 1 Success -->
    <g class="anim-l2" transform="translate(0, 56)">
      <text x="0" y="0">
        <tspan class="c-green">✔ [STEP 1/3] preflight_checks</tspan>
        <tspan class="c-dim"> ... </tspan>
        <tspan class="c-green">COMPLETED</tspan>
        <tspan class="c-dim"> (0.14s) → outputs: {"nodes": 10, "healthy": true}</tspan>
      </text>
    </g>

    <!-- Line 3: Step 2 Success -->
    <g class="anim-l3" transform="translate(0, 80)">
      <text x="0" y="0">
        <tspan class="c-green">✔ [STEP 2/3] build_container</tspan>
        <tspan class="c-dim">  ... </tspan>
        <tspan class="c-green">COMPLETED</tspan>
        <tspan class="c-dim"> (2.10s) → image: sha256:7f9a8b1c (142MB)</tspan>
      </text>
    </g>

    <!-- Line 4: Step 3 Simulated Crash -->
    <g class="anim-l4" transform="translate(0, 114)">
      <text x="0" y="0">
        <tspan class="c-red">✖ [STEP 3/3] push_registry</tspan>
        <tspan class="c-dim">    ... </tspan>
        <tspan class="c-red">FAILED: ConnectionResetError</tspan>
        <tspan class="c-dim"> (Socket timed out during upload)</tspan>
      </text>
    </g>

    <!-- Line 5: Failure capture & State Freeze -->
    <g class="anim-l5" transform="translate(0, 138)">
      <text x="0" y="0">
        <tspan class="c-dim">[FREEZE] Process interrupted at Step 3. Run sealed with status: </tspan>
        <tspan class="c-yellow">FAILED</tspan>
      </text>
    </g>

    <!-- Line 6: Resume Call -->
    <g class="anim-l6" transform="translate(0, 172)">
      <text x="0" y="0">
        <tspan class="c-cyan">❯ </tspan>
        <tspan class="c-white">ledger.resume_run("run_90c_8f2a1b")</tspan>
        <tspan class="c-dim">  # Zero-cost rehydration</tspan>
      </text>
    </g>

    <!-- Line 7: Zero duplicate cost confirmation -->
    <g class="anim-l7" transform="translate(0, 196)">
      <text x="0" y="0">
        <tspan class="c-cyan">[RESUME]</tspan>
        <tspan class="c-white"> Restored 2 completed steps. </tspan>
        <tspan class="c-green">ZERO duplicate LLM tokens / $0.00 wasted.</tspan>
      </text>
    </g>

    <!-- Line 8: Step 3 Retry Success -->
    <g class="anim-l8" transform="translate(0, 226)">
      <text x="0" y="0">
        <tspan class="c-green">✔ [STEP 3/3] push_registry (retry 1)</tspan>
        <tspan class="c-dim"> ... </tspan>
        <tspan class="c-green">COMPLETED</tspan>
        <tspan class="c-dim"> → url: ecr.aws/service:v1.4</tspan>
      </text>
    </g>

    <!-- Line 9: Circuit Breaker & Done -->
    <g class="anim-l9" transform="translate(0, 260)">
      <text x="0" y="0">
        <tspan class="c-dim">[CIRCUIT BREAKER] Repetitions: 0/3 (healthy) | Status: </tspan>
        <tspan class="c-green">COMPLETED</tspan>
        <tspan class="c-dim"> | SHA-256 Digest: </tspan><tspan class="c-cyan">e3b0c442...</tspan>
        <tspan class="cursor"> █</tspan>
      </text>
    </g>

  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="10" y="457" width="860" height="3" fill="url(#headerGradCyan)" rx="1.5"/>
</svg>
